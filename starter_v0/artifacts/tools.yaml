# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng khi thiếu mã định danh, khi giá trị nằm ngoài danh sách cho phép, hoặc khi cần xin xác nhận hành động."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], description: "Kiểu trả lời: 'text' khi thiếu asset_id hoặc employee_id; 'yes_no' khi xin xác nhận trước khi tạo ticket; 'choice' khi người dùng nêu giá trị nằm ngoài enum."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type là 'choice', ví dụ ['production', 'staging']"}
      required: [question, response_type]

  - name: search_kb
    description: "Tìm hướng dẫn hỗ trợ kỹ thuật."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái một dịch vụ dùng chung. CHỈ dùng cho môi trường production hoặc staging. Nếu người dùng nêu môi trường lạ (demo, lab), không gọi tool này mà gọi clarify choice."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: >-
      Đọc bản ghi tồn kho và ảnh chụp chẩn đoán của MỘT thiết bị theo mã tài sản.
      Dùng khi cần biết tình trạng kỹ thuật của chính thiết bị đó.
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản của thiết bị. Chỉ nhận mã tài sản; mã nhân viên không phải là giá trị hợp lệ cho tham số này."}
        check:
          type: string
          enum: [all, network, vpn, security, hardware, software]
          description: >-
            Nhóm chẩn đoán cần đọc. Luôn truyền tường minh.
            Nếu người dùng nêu sự cố/triệu chứng VPN trên máy (kể cả nói 'kiểm tra máy đó', 'VPN certificate hết hạn'), PHẢI chọn 'vpn'.
            Nếu nêu sự cố mạng/Wi-Fi, chọn 'network'. Nếu nêu phần cứng, chọn 'hardware'.
            Chỉ dùng 'all' khi người dùng yêu cầu 'kiểm tra tổng thể' hoặc hoàn toàn không nêu triệu chứng cụ thể nào.
      required: [asset_id, check]

  - name: lookup_user
    description: >-
      Đọc directory record của một nhân viên theo mã nhân viên. Bản ghi trả về đã bao gồm
      phòng ban, trạng thái tài khoản, trạng thái MFA và DANH SÁCH THIẾT BỊ ĐƯỢC CẤP,
      nên một lời gọi là đủ để trả lời câu hỏi về tài khoản và về thiết bị đang cấp cho
      người đó. Chỉ gọi thêm tool thiết bị khi người dùng cần chẩn đoán kỹ thuật của một
      máy cụ thể và đã có mã tài sản.
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên. Chỉ nhận mã nhân viên; mã tài sản không phải là giá trị hợp lệ cho tham số này."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ. CHỈ được gọi khi người dùng đã xác nhận rõ ràng (confirmed=true). TUYỆT ĐỐI KHÔNG gọi tool này ở lượt đầu tiên khi người dùng mới yêu cầu; lượt đầu tiên bắt buộc phải gọi clarify với response_type='yes_no' để hỏi người dùng có đồng ý tạo hay không."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]

  # ---------------- Team Bonus Tool ----------------
  - name: approved_software_catalog
    description: >-
      Tra cứu danh mục phần mềm doanh nghiệp được phê duyệt, bị cấm hoặc cần xin quyền (ví dụ Docker, AnyDesk, VSCode, Slack, Wireshark).
      Dùng khi người dùng hỏi có được phép cài đặt hoặc sử dụng một phần mềm hay không, điều kiện cấp license, hoặc phần mềm thay thế an toàn.
    parameters:
      type: object
      properties:
        software_name:
          type: string
          default: ""
          description: "Tên phần mềm cần tra cứu, ví dụ 'Docker', 'AnyDesk', 'VSCode'."
        category:
          type: string
          enum: [all, developer_tools, communication, remote_access, security_tools, browser]
          default: "all"
          description: "Phân loại phần mềm."
      required: [software_name]
