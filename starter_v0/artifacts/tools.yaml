# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng khi thiếu thông tin bắt buộc, lựa chọn còn mơ hồ, hoặc cần xác nhận trước một thao tác có tác động. Không gọi tool chuyên biệt khi chưa có dữ liệu đầu vào cần thiết."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_kb
    description: "Tìm bài viết knowledge base nội bộ về cách dùng, cấu hình hoặc khắc phục sự cố theo chủ đề. Dùng khi cần hướng dẫn có thể tái sử dụng; không dùng để lấy trạng thái live của service, inventory/chẩn đoán một asset, hay thông tin employee. Chọn category sát nhất với vấn đề và truyền query mô tả nhu cầu. Có thể gọi cùng tool khác chỉ khi yêu cầu đồng thời cần hướng dẫn và một loại dữ liệu riêng."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm nội dung knowledge base"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hiện tại của một shared service: availability, incident hoặc maintenance trong production/staging. Dùng cho sự cố hoặc tình trạng ảnh hưởng ở cấp service chung; không dùng cho chẩn đoán một asset, hướng dẫn knowledge base, hay thông tin employee. Mặc định environment là production khi không được nêu; hỏi lại nếu môi trường được nêu nhưng không xác định rõ."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường"}
      required: [service]

  - name: inspect_device
    description: "Đọc inventory và diagnostic snapshot của một asset nội bộ được chỉ rõ bằng asset_id. Dùng khi cần kiểm tra network, VPN, security, hardware, software hoặc toàn bộ thiết bị đó; không dùng cho shared-service status, bài hướng dẫn, hay chỉ để biết asset được cấp cho employee. Không suy ra asset_id mới từ kết quả tool khác để inspect nếu người dùng chưa yêu cầu diagnostics hoặc inventory."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu directory record của một employee bằng employee_id chính xác. Trả về metadata hỗ trợ và danh sách assigned_assets; dùng khi cần tài khoản hoặc thiết bị được cấp cho employee. Không dùng cho live service status, knowledge base, hay inventory/chẩn đoán của một asset."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket hỗ trợ sau khi người dùng xác nhận rõ ràng ticket hiện tại. Không tạo ticket chỉ vì người dùng mô tả sự cố hoặc từng xác nhận một yêu cầu đã bị sửa/cancel; khi đó phải dùng clarify để xin xác nhận mới."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
